experiment: F-DiT
method: fm
seed: 44
data:
  root: ./data
  num_workers: 6
model:
  type: dit
  num_classes: 10
  image_size: 32
  patch_size: 2
  embed_dim: 384
  depth: 12
  num_heads: 6
  time_scale: 1000.0
train:
  batch_size: 128
  microbatch_size: 128
  max_steps: 200000
  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.0
  warmup_steps: 5000
  decay_start_step: 150000
  min_lr: 0.00002
  grad_clip: 1.0
  ema_decay: 0.9999
  precision: bf16
  t_sampling: uniform
  cond_drop_prob: 1.0
  log_every: 100
  save_every: 10000
  snapshot_every: 50000
