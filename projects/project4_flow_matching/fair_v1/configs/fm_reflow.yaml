experiment: F-RF
method: fm
data:
  source: reflow_pairs
  root: /root/autodl-tmp/checkpoints/project4-fair-v1/reflow_pairs
  num_workers: 4
model:
  type: p1_unet
  in_channels: 3
  out_channels: 3
  base_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  image_size: 32
  skip_layout: full
train:
  batch_size: 128
  microbatch_size: 128
  max_steps: 50000
  lr: 0.00002
  betas: [0.9, 0.999]
  weight_decay: 0.0
  warmup_steps: 1000
  decay_start_step: 1000
  min_lr: 0.000002
  grad_clip: 1.0
  ema_decay: 0.9999
  precision: bf16
  t_sampling: uniform
  cond_drop_prob: 0.0
  log_every: 100
  save_every: 10000
  snapshot_every: 50000
