# R4: the single follow-up experiment for the FID<=15 target.
# Keep every R3 control fixed and change only the epsilon-loss weighting.
output_dir: runs/fid15_r4_min_snr
seed: 44

dataset:
  name: cifar10
  batch_size: 128
  image_size: 32
  num_workers: 8
  root: ./data

model:
  in_channels: 3
  out_channels: 3
  base_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  image_size: 32
  skip_layout: full

diffusion:
  T: 1000
  beta_schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  s: 0.008

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 5000

ema_decays: [0.999, 0.9995, 0.9999]
mixed_precision: fp16

training:
  num_epochs: 200
  max_steps: 78000
  log_every: 100
  sample_every: 10000
  ckpt_every: 10000
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  loss_weighting: min_snr
  min_snr_gamma: 5.0

wandb:
  enabled: false
