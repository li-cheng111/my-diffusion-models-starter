# R5: strict 200-epoch follow-up to R3.
# Change from R3: keep uniform epsilon loss, but hold the warmed-up learning
# rate until step 58,500 and cosine-decay only during the final 25% of updates.
output_dir: runs/fid15_r5_late_decay
seed: 44

dataset:
  name: cifar10
  batch_size: 128
  image_size: 32
  num_workers: 8
  root: ./data

model:
  in_channels: 3
  out_channels: 3
  base_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  image_size: 32
  skip_layout: full

diffusion:
  T: 1000
  beta_schedule: cosine
  beta_start: 0.0001
  beta_end: 0.02
  s: 0.008

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 5000
  lr_schedule: warmup_late_cosine
  late_decay_start_step: 58500
  min_lr: 2.0e-5

ema_decays: [0.999, 0.9995, 0.9999]
mixed_precision: fp16

training:
  num_epochs: 200
  max_steps: 78000
  log_every: 100
  sample_every: 10000
  ckpt_every: 10000
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  loss_weighting: uniform

wandb:
  enabled: false
