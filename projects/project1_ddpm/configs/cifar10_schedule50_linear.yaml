# 50-epoch paired schedule comparison: linear diffusion.
output_dir: runs/schedule50/linear
seed: 42

dataset:
  name: cifar10
  batch_size: 128
  image_size: 32
  num_workers: 8
  root: ./data

model:
  in_channels: 3
  out_channels: 3
  base_channels: 128
  channel_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.1
  image_size: 32
  skip_layout: full

diffusion:
  T: 1000
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02

optimizer:
  lr: 2.0e-4
  weight_decay: 0.0
  warmup_steps: 5000

ema_decays: [0.999, 0.9995, 0.9999]
mixed_precision: fp16

training:
  num_epochs: 50
  log_every: 100
  sample_every: 0
  ckpt_every: 0
  grad_clip: 1.0
  gradient_accumulation_steps: 1
  loss_weighting: uniform
  prediction_type: epsilon
  exact_epoch_resume: true
  clip_denoised_samples: true

wandb:
  enabled: false
